[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudserve-capstone"
version = "0.1.0"
description = "CloudServe FDE capstone API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.163,<1",
  "uvicorn>=0.54,<1",
  "scikit-learn>=1.9,<2",
  "numpy>=2.5,<3",
  "pydantic>=2.14,<3"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cloudserve*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
