[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudserve-capstone"
version = "0.1.0"
description = "CloudServe FDE capstone API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "scikit-learn>=1.5,<2",
  "numpy>=2,<3",
  "httpx>=0.27,<1"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cloudserve*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
